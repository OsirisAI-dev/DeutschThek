    <!-- Library loading: local files are tried first (this app is meant to run
         fully offline, next to these .js files on disk). If a local file is
         missing or fails to load for any reason, each library falls back to
         loading the same version from a CDN, so the app still works instead
         of silently losing PDF/DOCX/ZIP features. window.OSIRIS_LIBS_READY
         resolves once every library has settled (loaded, either way, or
         failed both attempts) — code that touches PDFLib/JSZip/mammoth/
         pdfjsLib awaits it first. -->
    <script>
      function osirisLoadWithFallback(localSources, cdnSrc, testGlobal) {
        return new Promise((resolve) => {
          if (testGlobal && window[testGlobal]) { resolve(true); return; }
          const sources = Array.isArray(localSources) ? [...localSources] : [localSources];
          
          function tryNext() {
            if (testGlobal && window[testGlobal]) { resolve(true); return; }
            if (sources.length > 0) {
              const src = sources.shift();
              const script = document.createElement('script');
              script.src = src;
              script.onload = () => resolve(true);
              script.onerror = () => {
                tryNext();
              };
              document.head.appendChild(script);
            } else if (cdnSrc) {
              const cdn = document.createElement('script');
              cdn.src = cdnSrc;
              cdn.onload = () => resolve(true);
              cdn.onerror = () => {
                console.warn('[Osiris] Weder lokale Offline-Pfade noch CDN erreichbar:', cdnSrc);
                resolve(false);
              };
              document.head.appendChild(cdn);
            } else {
              resolve(false);
            }
          }
          tryNext();
        });
      }

      window.OSIRIS_LIBS_READY = Promise.all([
        osirisLoadWithFallback(['js/core/community-swarm.js?v=3.3', '../js/core/community-swarm.js?v=3.3', "community-swarm.js?v=3.3"], null, 'EduHybridShare'),
        osirisLoadWithFallback(['lib/mammoth/v1/mammoth.browser.js', 'lib/mammoth/mammoth.browser.js', '../lib/mammoth/v1/mammoth.browser.js', 'mammoth.browser.js'], 'https://cdn.jsdelivr.net/npm/mammoth@1.7.2/mammoth.browser.min.js', 'mammoth'),
        osirisLoadWithFallback(['lib/pdf/v1/pdf.min.js', 'lib/pdf/pdf.min.js', '../lib/pdf/v1/pdf.min.js', 'pdf.min.js'], 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js', 'pdfjsLib'),
        osirisLoadWithFallback(['lib/pdf/v1/pdf-lib.min.js', 'lib/pdf/pdf-lib.min.js', '../lib/pdf/v1/pdf-lib.min.js', 'pdf-lib.min.js'], 'https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js', 'PDFLib'),
        osirisLoadWithFallback(['lib/jszip/v1/jszip.min.js', 'lib/jszip/jszip.min.js', '../lib/jszip/v1/jszip.min.js', 'jszip.min.js'], 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js', 'JSZip'),
        osirisLoadWithFallback(['lib/htmldocx/v1/html-docx.js', 'lib/htmldocx/html-docx.js', '../lib/htmldocx/v1/html-docx.js', 'html-docx.js'], 'https://cdn.jsdelivr.net/npm/html-docx-js@0.3.1/dist/html-docx.js', 'htmlDocx'),
      
        osirisLoadWithFallback(['lib/peerjs/v1/peerjs.min.js', 'lib/peerjs/peerjs.min.js', '../lib/peerjs/v1/peerjs.min.js', '../lib/peerjs/peerjs.min.js', 'peerjs.min.js'], 'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js', 'Peer'),
        osirisLoadWithFallback(['lib/pdf/v1/pdf.worker.min.js', 'lib/pdf/pdf.worker.min.js', '../lib/pdf/v1/pdf.worker.min.js', 'pdf.worker.min.js'], 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js', 'pdfjsWorker'),
      ]);
    </script>
    <script>
      // Pre-paint hub prefs read (font + lang) — same osiris_hub_prefs key
      // index.html (Edu-Hub) reads/writes, so this app opens already matching the
      // hub's current font/language instead of flashing its own defaults
      // first. Live changes while this tool stays open arrive separately
      // via the SET_FONT/SET_LANG postMessage listener below (Edu-Hub
      // pushes those directly to the embedded iframe on every toggle).
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem('osiris_hub_prefs') || '{}');
          var theme = p.theme || localStorage.getItem('wiki_theme') || 'light';
          document.documentElement.setAttribute('data-theme', theme);
          if (p.font) document.documentElement.style.setProperty('--bank-font-family', p.font);
          window.__bankLang = 'DE';
        } catch (e) { window.__bankLang = 'DE'; }
      })();
    </script>

    // --- Predictive Dictionary ---
    function saveToDictionary(field, value) {
        if (!value || !value.trim()) return;
        const key = 'wiki_dict_' + field;
        const dict = JSON.parse(localStorage.getItem(key)) || [];
        const normalized = value.trim();
        if (!dict.some(d => d.toLowerCase() === normalized.toLowerCase())) {
            dict.push(normalized);
            dict.sort((a, b) => a.localeCompare(b));
            localStorage.setItem(key, JSON.stringify(dict));
        }
        refreshDatalist(field);
    }

    function refreshDatalist(field) {
        const dl = document.getElementById('dict-' + field);
        if (!dl) return;
        const dict = JSON.parse(localStorage.getItem('wiki_dict_' + field)) || [];
        dl.innerHTML = dict.map(term => `<option value="${term.replace(/"/g, '&quot;')}"></option>`).join('');
    }

    
    function openSwarmDirect(event, tab) {

            window.parent.EduHybridShare.openSwarmModal(targetTab);
        } else if (window.EduHybridShare && typeof window.EduHybridShare.openSwarmModal === 'function') {
            window.EduHybridShare.openSwarmModal(targetTab);
        } else if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'OPEN_SWARM_MODAL', tab: targetTab }, '*');
        }
    }

    async function toggleCurrentDocSwarmShare(e) {
        if (e) e.stopPropagation();
        if (!window._currentModalDoc) return;
        const doc = window._currentModalDoc;
        const docId = Number(doc.id);
        if (!docId) return;
        const curDocSize = Number(doc.fileSize) || (doc.fileData ? Math.round(doc.fileData.length * 0.75) : 0);
        if (curDocSize > 10 * 1024 * 1024) {
            const sizeMb = (curDocSize / (1024 * 1024)).toFixed(1);
            if (window.EduHybridShare && typeof window.EduHybridShare.showSwarmToast === 'function') {
                window.EduHybridShare.showSwarmToast(`⚠️ P2P-Limit: Datei ist ${sizeMb} MB groß (maximal 10 MB erlaubt). Bitte per Bluetooth oder Social Media teilen.`, 'warning');
            } else {
                alert(`⚠️ P2P-Schwarm-Limit: Diese Datei ist ${sizeMb} MB groß (maximal 10 MB erlaubt).`);
            }
            return;
        }
        if (window.EduHybridShare) {
            await window.EduHybridShare.toggleShareDocToSwarm(docId, true, doc);
        }
        if (window.parent && window.parent !== window && window.parent.EduHybridShare) {
            await window.parent.EduHybridShare.toggleShareDocToSwarm(docId, true, doc);
        }
        updateSwarmShareButtonState(true);
    }

    function seedDictionaryFromDB() {
        if (!idb) return;
        const tx = idb.transaction(["documents"], "readonly");
        tx.objectStore("documents").getAll().onsuccess = (e) => {
            e.target.result.forEach(item => {
                ['thema', 'lektion', 'buch'].forEach(field => {
                    if (item[field]) saveToDictionary(field, item[field]);
                });
            });
        };
    }

    function onBuchSelected(buchName) {
        const data = CURRICULUM_DATA[buchName];
        const themaSelect = document.getElementById('inp-thema');
        const lektionSelect = document.getElementById('inp-lektion');
        const klassenSelect = document.getElementById('inp-klassen');
        const themaOther = document.getElementById('inp-thema-other');
        const lektionOther = document.getElementById('inp-lektion-other');

        if (themaOther) { themaOther.style.display = 'none'; themaOther.value = ''; }
        if (lektionOther) { lektionOther.style.display = 'none'; lektionOther.value = ''; }

        // Auto-select corresponding Klassenstufe
        if (data && data.klasse && klassenSelect) {
            klassenSelect.value = data.klasse;
            if (typeof checkKlassen === 'function') checkKlassen();
        }

        // Populate Themen
        if (data && data.themes && data.themes.length > 0) {
            let thHtml = `<option value="" disabled selected data-i18n="chooseThema">Themenbereich wählen...</option>`;
            data.themes.forEach(t => {
                thHtml += `<option value="${escapeHtml(t.title)}">${escapeHtml(t.fullTitle || t.title)}</option>`;
            });
            thHtml += `<option value="SONSTIGES">SONSTIGES (freies Thema)...</option>`;
            themaSelect.innerHTML = thHtml;

    // --- Metadata Injector: detect already-uploaded files and auto-fill the form ---

    async function computeFileHash(file, preloadedBuffer) {
        try {
            const buffer = preloadedBuffer || await file.arrayBuffer();
            const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
            return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
        } catch (err) {
            console.error('Hash-Berechnung fehlgeschlagen:', err);
            return null;
        }
    }

    function findMatchingEntry(file, hash) {
        return new Promise((resolve) => {
            // Ultra-fast in-memory cache check (0.01ms) - bypasses heavy IndexedDB deserialization
            if (window._docMetaCache && window._docMetaCache.length > 0) {
                const items = window._docMetaCache.filter(it => it.id !== window.editingId);
                let match = hash ? items.find(it => it.fileHash && it.fileHash === hash) : null;
                if (!match) {
                    match = items.find(it => it.fileName === file.name && it.fileSize === file.size);
                }
                if (match) { resolve(match); return; }
            }
            if (!idb) { resolve(null); return; }
            const tx = idb.transaction(["documents"], "readonly");
            tx.objectStore("documents").getAll().onsuccess = (e) => {
                const items = (e.target.result || []).filter(it => it.id !== window.editingId);
                let match = hash ? items.find(it => it.fileHash && it.fileHash === hash) : null;
                if (!match) {
                    match = items.find(it => it.fileName === file.name && it.fileSize === file.size);
                }
                resolve(match || null);
            };
            tx.onerror = () => resolve(null);
        });
    }

    // --- Persistent in-file metadata: embed Info-box data directly into the
    // PDF/DOCX bytes on save, so the data travels with the file itself (e.g.
    // when handed to someone else) instead of only living in this browser's
    // IndexedDB. Marker wrapper: { app: 'OsirisMeineBank', v: 1, data: {...} } ---

    const OSIRIS_META_KEY = 'OsirisMeineBank';

    function dataUrlToBytes(dataUrl) {
        const base64 = dataUrl.split(',')[1] || '';
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return bytes;
    }

    function bytesToDataUrl(bytes, mimeType) {
        let binary = '';
        if (typeof TextDecoder !== 'undefined') {
            try {
                binary = new TextDecoder('latin1').decode(bytes);
            } catch (e) {
                binary = '';
            }
        }
        if (!binary) {
            const chunkSize = 0x8000;
            for (let i = 0; i < bytes.length; i += chunkSize) {
                binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
            }
        }
        return `data:${mimeType};base64,${btoa(binary)}`;
    }

    function buildMetaPayload(meta) {
        return JSON.stringify({ app: 'OsirisMeineBank', v: 1, data: meta });
    }

    function parseMetaPayload(raw) {
        try {
            const parsed = safeJsonParse(raw);
            if (parsed && parsed.app === 'OsirisMeineBank' && parsed.data && typeof parsed.data === 'object') return parsed.data;
        } catch (err) { /* not our payload, or corrupted — ignore */ }
        return null;
    }

    async function embedMetadataIntoPdf(dataUrl, meta) {
        await window.OSIRIS_LIBS_READY;
        if (typeof PDFLib === 'undefined') return dataUrl; // library missing — skip silently
        try {
            const bytes = dataUrlToBytes(dataUrl);
            const pdfDoc = await PDFLib.PDFDocument.load(bytes, { updateMetadata: false, ignoreEncryption: true });
            // Calling a standard setter first guarantees pdf-lib creates the Info
            // dictionary if the PDF didn't already have one.
            pdfDoc.setProducer('Osiris Inc. – MeineBank');
            pdfDoc.setModificationDate(new Date());
            const infoDict = pdfDoc.context.lookup(pdfDoc.context.trailerInfo.Info);
            infoDict.set(PDFLib.PDFName.of(OSIRIS_META_KEY), PDFLib.PDFHexString.fromText(buildMetaPayload(meta)));
            const outBytes = await pdfDoc.save({ useObjectStreams: false });
            return bytesToDataUrl(outBytes, 'application/pdf');
        } catch (err) {
            console.error('PDF-Metadaten-Einbettung fehlgeschlagen, Original wird gespeichert:', err);
            return dataUrl;
        }
    }

    async function embedMetadataIntoDocx(dataUrl, meta, mimeType) {
        await window.OSIRIS_LIBS_READY;
        if (typeof JSZip === 'undefined') return dataUrl; // library missing — skip silently
        try {
            const bytes = dataUrlToBytes(dataUrl);
            const zip = await JSZip.loadAsync(bytes);
            const escaped = buildMetaPayload(meta)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

            const customEntry = zip.file('docProps/custom.xml');
            let propsInner = '';
            let pid = 2;
            if (customEntry) {
                const existingXml = await customEntry.async('string');
                const doc = new DOMParser().parseFromString(existingXml, 'application/xml');
                const props = Array.from(doc.getElementsByTagName('property'));
                const kept = props.filter(p => p.getAttribute('name') !== OSIRIS_META_KEY);
                pid = kept.reduce((max, p) => Math.max(max, parseInt(p.getAttribute('pid'), 10) || 0), 1) + 1;
                propsInner = kept.map(p => new XMLSerializer().serializeToString(p)).join('');
            }
            propsInner += `<property fmtid="{D5CDD505-2E9C-101B-9397-08002B2CF9AE}" pid="${pid}" name="${OSIRIS_META_KEY}"><vt:lpwstr>${escaped}</vt:lpwstr></property>`;
            const newCustomXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/custom-properties" xmlns:vt="http://schemas.openxmlformats.org/officeDocument/2006/docPropsVTypes">${propsInner}</Properties>`;
            zip.file('docProps/custom.xml', newCustomXml);

            const ctPath = '[Content_Types].xml';
            const ctEntry = zip.file(ctPath);
            if (ctEntry) {
                let ctXml = await ctEntry.async('string');
                if (!ctXml.includes('docProps/custom.xml')) {
                    ctXml = ctXml.replace('</Types>', '<Override PartName="/docProps/custom.xml" ContentType="application/vnd.openxmlformats-officedocument.custom-properties+xml"/></Types>');
                    zip.file(ctPath, ctXml);
                }
            }

            const relsPath = '_rels/.rels';
            const relsEntry = zip.file(relsPath);
            if (relsEntry) {
                let relsXml = await relsEntry.async('string');
                if (!relsXml.includes('docProps/custom.xml')) {
                    const relIds = Array.from(relsXml.matchAll(/Id="rId(\d+)"/g)).map(m => parseInt(m[1], 10));
                    const nextRelId = (relIds.length ? Math.max(...relIds) : 0) + 1;
                    relsXml = relsXml.replace('</Relationships>', `<Relationship Id="rId${nextRelId}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/custom-properties" Target="docProps/custom.xml"/></Relationships>`);
                    zip.file(relsPath, relsXml);
                }
            }

            const outBytes = await zip.generateAsync({ type: 'uint8array' });
            return bytesToDataUrl(outBytes, mimeType || 'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
        } catch (err) {
            console.error('DOCX-Metadaten-Einbettung fehlgeschlagen, Original wird gespeichert:', err);
            return dataUrl;
        }
    }

    // isPdfFile/isDocxFile mirror the detection already used for previews further down.
    function isPdfFile(name, type) {
        return (type && type.includes('pdf')) || name.toLowerCase().endsWith('.pdf');
    }
    function isDocxFile(name, type) {
        return (type && type.includes('wordprocessingml')) || name.toLowerCase().endsWith('.docx');
    }

    async function embedMetadataIfApplicable(dataUrl, meta, fileName, fileType) {
        try {
            if (isPdfFile(fileName, fileType)) return await embedMetadataIntoPdf(dataUrl, meta);
            if (isDocxFile(fileName, fileType)) return await embedMetadataIntoDocx(dataUrl, meta, fileType);
        } catch (err) {
            console.error('Metadaten-Einbettung übersprungen:', err);
        }
        return dataUrl;
    }

    async function readEmbeddedMetaFromPdf(file, preloadedBuffer) {
        try {
            const buffer = preloadedBuffer || await file.arrayBuffer();
            // Fast binary pre-scan & ultra-fast direct extraction (< 2ms)
            const u8 = new Uint8Array(buffer);
            const keyBytes = [79, 115, 105, 114, 105, 115, 77, 101, 105, 110, 101, 66, 97, 110, 107]; // 'OsirisMeineBank'
            let hasKey = false;
            let keyIdx = -1;
            const searchLimit = Math.min(u8.length - keyBytes.length, 300000);
            const endStart = Math.max(0, u8.length - 200000);
            function checkRegion(start, end) {
                for (let i = start; i < end; i++) {
                    if (u8[i] === keyBytes[0]) {
                        let match = true;
                        for (let k = 1; k < keyBytes.length; k++) {
                            if (u8[i + k] !== keyBytes[k]) { match = false; break; }
                        }
                        if (match) { keyIdx = i; return true; }
                    }
                }
                return false;
            }
            hasKey = checkRegion(endStart, u8.length - keyBytes.length) || checkRegion(0, searchLimit);
            if (!hasKey) return null;

            // Direct fast extraction from raw PDF trailer/object (< 2ms)
            if (keyIdx !== -1) {
                const maxLen = Math.min(u8.length - keyIdx, 30000);
                const tail = typeof TextDecoder !== 'undefined'
                    ? new TextDecoder('latin1').decode(u8.subarray(keyIdx, keyIdx + maxLen))
                    : Array.from(u8.subarray(keyIdx, keyIdx + maxLen)).map(c => String.fromCharCode(c)).join('');
                const hexMatch = tail.match(/<([0-9a-fA-F\s]+)>/);
                if (hexMatch) {
                    const hex = hexMatch[1].replace(/\s+/g, '');
                    if (hex.length >= 8) {
                        let text = '';
                        if (hex.startsWith('FEFF') || hex.startsWith('feff')) {
                            for (let i = 4; i < hex.length; i += 4) {
                                const code = parseInt(hex.substr(i, 4), 16);
                                if (!isNaN(code)) text += String.fromCharCode(code);
                            }
                        } else {
                            const byteArr = new Uint8Array(hex.length / 2);
                            for (let i = 0; i < hex.length; i += 2) {
                                byteArr[i / 2] = parseInt(hex.substr(i, 2), 16);
                            }
                            text = typeof TextDecoder !== 'undefined'
                                ? new TextDecoder('utf-8').decode(byteArr)
                                : Array.from(byteArr).map(c => String.fromCharCode(c)).join('');
                        }
                        const directMeta = parseMetaPayload(text);
                        if (directMeta) return directMeta;
                    }
                }
            }

            await window.OSIRIS_LIBS_READY;
            const pdfjsLib = window['pdfjs-dist/build/pdf'] || window.pdfjsLib;
            if (!pdfjsLib) return null;
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'lib/pdf/v1/pdf.worker.min.js';
            const loadingTask = pdfjsLib.getDocument({ data: buffer.slice(0), isEvalSupported: false });
            const pdf = await loadingTask.promise;
            const metadata = await pdf.getMetadata();
            const raw = metadata && metadata.info && (metadata.info[OSIRIS_META_KEY] || (metadata.info.Custom && metadata.info.Custom[OSIRIS_META_KEY]));
            return raw ? parseMetaPayload(raw) : null;
        } catch (e) {
            return null;
        }
    }

    async function readEmbeddedMetaFromDocx(file, preloadedBuffer) {
        await window.OSIRIS_LIBS_READY;
        if (typeof JSZip === 'undefined') return null;
        const buffer = preloadedBuffer || await file.arrayBuffer();
        const zip = await JSZip.loadAsync(buffer);
        const customEntry = zip.file('docProps/custom.xml');
        if (!customEntry) return null;
        const xmlText = await customEntry.async('string');
        const doc = new DOMParser().parseFromString(xmlText, 'application/xml');
        const props = Array.from(doc.getElementsByTagName('property'));
        const target = props.find(p => p.getAttribute('name') === OSIRIS_META_KEY);
        if (!target) return null;
        const lpwstr = target.getElementsByTagName('vt:lpwstr')[0] || target.getElementsByTagName('lpwstr')[0];
        if (!lpwstr) return null;
        return parseMetaPayload(lpwstr.textContent);
    }

    async function readEmbeddedMetaFromFile(file, preloadedBuffer) {
        try {
            if (isPdfFile(file.name, file.type)) return await readEmbeddedMetaFromPdf(file, preloadedBuffer);
            if (isDocxFile(file.name, file.type)) return await readEmbeddedMetaFromDocx(file, preloadedBuffer);
        } catch (err) {
            console.error('Metadaten-Auslesen aus Datei fehlgeschlagen:', err);
        }
        return null;
    }

    }

    function hideDuplicateNotice(statusEl) {
        statusEl.style.display = 'none';
        statusEl.innerHTML = '';
    }

    async function handleFileSelect(e) {
        const file = e.target.files[0];
        const statusEl = document.getElementById('file-dup-status');
        window.duplicateBlocked = false;
        setSaveBtnEnabled(true);
        delete e.target.dataset.fileHash;

        if (!file) { hideDuplicateNotice(statusEl); return; }
        if (!idb) return; // DB not ready yet, skip silently



        showCheckingNotice(statusEl);
        setSaveBtnEnabled(false);

        let rawBuf = null;
        // Deep Security Inspection (Magic Bytes, 25MB limit, PDF /JavaScript, DOCX VBA Macros)
        try {
            await window.OSIRIS_LIBS_READY;
            rawBuf = await file.arrayBuffer();
            // Cache single shared raw buffer & pre-converted DataURL for instant 0ms save
            e.target._cachedRawBuf = rawBuf;
            e.target._cachedFileName = file.name;
            e.target._cachedFileSize = file.size;
            e.target._cachedDataUrl = bytesToDataUrl(new Uint8Array(rawBuf), file.type || 'application/pdf');

            if (window.OsirisSecurity) {
                const secCheck = window.OsirisSecurity.validateMagicBytes(new Uint8Array(rawBuf), file.name);
                if (!secCheck.valid) {
                    window.duplicateBlocked = true;
                    setSaveBtnEnabled(false);
                    statusEl.style.display = 'flex';
                    statusEl.style.background = 'rgba(220,53,69,0.12)';
                    statusEl.innerHTML = `<div style="color:#dc3545; font-weight:bold;">🛑 Sicherheitsblockade: ${escapeHtml(secCheck.reason)}</div>`;
                    e.target.value = '';
                    return;
                }
            }
        } catch (secErr) {
            console.error('Security check failed:', secErr);
        }

        const hash = await computeFileHash(file, rawBuf);
        // Stash the hash so saveEntry() can reuse it without re-reading the file
        if (hash) e.target.dataset.fileHash = hash;

        // Guard against the user swapping the file again before hashing finished
        if (e.target.files[0] !== file) return;

        const match = await findMatchingEntry(file, hash);
        if (match) {
            applyMetadataFromEntry(match);
            showDuplicateNotice(statusEl, match); // sets duplicateBlocked = true
            return;
        }

        // No local record of this file — check whether the file itself carries
        // Osiris metadata embedded during a previous save (e.g. on another device).
        setSaveBtnEnabled(true);
        const embeddedMeta = await readEmbeddedMetaFromFile(file, rawBuf);
        if (e.target.files[0] !== file) return; // guard again after async work
        if (embeddedMeta) {
            applyMetadataFromEntry(embeddedMeta);
            showEmbeddedMetadataNotice(statusEl, embeddedMeta);
        } else {
            hideDuplicateNotice(statusEl);
        }
    }

    async function autoShareToSwarm(docItem) {
        if (!docItem || !docItem.id) return;
        const itemSize = Number(docItem.fileSize) || (docItem.fileData ? Math.round(docItem.fileData.length * 0.75) : 0);
        if (itemSize > 10 * 1024 * 1024) {
            console.log(`[P2P Limit] Datei „${docItem.thema}“ ist größer als 10 MB (${(itemSize / (1024*1024)).toFixed(1)} MB). Kein Auto-Share im P2P-Schwarm.`);
            return;
        }
        try {
            if (window.EduHybridShare && typeof window.EduHybridShare.toggleShareDocToSwarm === 'function') {
                await window.EduHybridShare.toggleShareDocToSwarm(docItem.id, true, docItem);
            }
            if (window.parent && window.parent !== window && window.parent.EduHybridShare && typeof window.parent.EduHybridShare.toggleShareDocToSwarm === 'function') {
                await window.parent.EduHybridShare.toggleShareDocToSwarm(docItem.id, true, docItem);
            }
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ type: 'SHARE_DOC_TO_SWARM', doc: docItem }, '*');
            }
        } catch (e) {
            console.warn('Auto-share to swarm failed:', e);
        }
    }

function saveEntry() {
        const rawThema = document.getElementById('inp-thema').value;
        let thema = (rawThema === 'SONSTIGES') 
            ? document.getElementById('inp-thema-other').value.trim() 
            : (rawThema ? rawThema.trim() : '');

        // LEKTION / MODUL is explicitly OPTIONAL
        const rawLektion = document.getElementById('inp-lektion').value;
        let lektion = (rawLektion === 'SONSTIGES') 
            ? document.getElementById('inp-lektion-other').value.trim() 
            : (rawLektion ? rawLektion.trim() : '');

        const rawBuch = document.getElementById('inp-buch').value;
        let buch = (rawBuch === 'SONSTIGES')
            ? document.getElementById('inp-buch-other').value.trim()
            : (rawBuch ? rawBuch.trim() : '');
        
        let klassen = document.getElementById('inp-klassen').value.trim();
        if (klassen === 'Sonstiges') {
            klassen = document.getElementById('inp-klassen-other').value.trim();
        }
        
        const jahr = document.getElementById('inp-jahr').value.trim();
        
        let typ = document.getElementById('inp-typ').value;
        if (typ === 'SONSTIGES') {
            typ = document.getElementById('inp-typ-other').value.trim();
        }

        const fileInput = document.getElementById('inp-file');

        // All fields obligatory EXCEPT lektion
        if (!thema || !buch || !klassen || !jahr || !typ || (fileInput.files.length === 0 && !window.editingId)) {
            alert("Bitte füllen Sie alle erforderlichen Felder aus und wählen Sie ein Dokument!");
            return;
        }

        // Hard stop: never persist a file that's already in the database.
        // This mirrors the async re-check below but catches the common case
        // immediately, without waiting on IndexedDB.
        if (window.duplicateBlocked && !window.editingId) {
            alert("Diese Datei ist bereits gespeichert. Bitte bearbeiten Sie den vorhandenen Eintrag, anstatt sie erneut hinzuzufügen.");
            return;
        }



        let subTyp = [];
        if (typ === 'PROBEPRÜFUNG' || typ === 'PRÜFUNG') {
            document.querySelectorAll('#sub-pruefung .sub-cb:checked').forEach(cb => {
                if(cb.value === 'SONSTIGES') {
                    const txt = document.getElementById('pruefung-other-text').value.trim();
                    subTyp.push(txt || 'SONSTIGES');
                } else {
                    subTyp.push(cb.value);
                }
            });
            if (subTyp.length === 0) { alert("Bitte wählen Sie einen Typ!"); return; }
        } else if (typ === 'KONTROLLE') {
            document.querySelectorAll('#sub-kontrolle .sub-cb:checked').forEach(cb => {
                if (cb.value === 'SONSTIGES') {
                    const txtInput = cb.closest('div').querySelector('input[type="text"]');
                    const txt = txtInput ? txtInput.value.trim() : '';
                    subTyp.push(txt || 'SONSTIGES'); 
                } else {
                    subTyp.push(cb.value);
                }
            });
            if (subTyp.length === 0) { alert("Bitte wählen Sie einen Typ!"); return; }
        }

        const file = fileInput.files[0];
        
        // --- LOADING BAR LOGIC START ---
        const saveBtn = document.getElementById('save-entry-btn');
        const saveProgress = document.getElementById('save-entry-progress');
        const saveText = document.getElementById('save-entry-text');

        if (saveBtn) saveBtn.style.pointerEvents = 'none';
        if (saveText) saveText.textContent = 'WIRD GESPEICHERT...';
        if (saveProgress) saveProgress.style.width = '10%';

        function persist(fileData, fileName, fileType, fileSize, fileHash) {
            const isEdit = !!window.editingId;
            const entry = {
                id: isEdit ? window.editingId : Date.now(),
                thema, lektion, buch, klassen, jahr, typ, subTyp,
                fileName, fileType, fileSize, fileHash,
                fileData,
                date: new Date().toLocaleDateString()
            };
            if (isEdit) {
                const txRead = idb.transaction(["documents"], "readonly");
                txRead.objectStore("documents").get(window.editingId).onsuccess = (ev) => {
                    const orig = ev.target.result;
                    entry.date = orig ? orig.date : new Date().toLocaleDateString();
                    writeEntry(entry, isEdit);
                };
            } else {
                writeEntry(entry, isEdit);
            }
        }

        function writeEntry(entry, isEdit) {
            const tx = idb.transaction(["documents"], "readwrite");
            const store = tx.objectStore("documents");
            isEdit ? store.put(entry) : store.add(entry);
            tx.oncomplete = () => {
                if (isSwarmAutoShareEnabled()) { autoShareToSwarm(entry); }
                if (saveProgress) saveProgress.style.width = '100%';
                
                // Slight delay to let the animation finish visually
                setTimeout(() => {
                    alert(isEdit ? "Dokument erfolgreich aktualisiert!" : "Dokument erfolgreich in der Datenbank gespeichert!");
                    document.getElementById('import-submenu').classList.remove('open');

                    if (saveProgress) {
                        saveProgress.style.transition = 'none';
                        saveProgress.style.width = '0%';
                        setTimeout(() => { saveProgress.style.transition = 'width 0.5s ease'; }, 50);
                    }
                    if (saveBtn) saveBtn.style.pointerEvents = 'auto';

                    resetImportForm();
                    saveToDictionary('thema', thema);
                    saveToDictionary('lektion', lektion);
                    if (rawThema === 'SONSTIGES' && thema) saveToDictionary('thema', thema);
        if (rawLektion === 'SONSTIGES' && lektion) saveToDictionary('lektion', lektion);
        if (rawBuch === 'SONSTIGES' && buch) saveToDictionary('buch', buch);
                    renderResults();
                }, 300);
            };
        }

        async function processFileAndPersist(dataUrl) {
            // Authoritative re-check right before writing: guards against
            // the flag-based check above going stale (e.g. a second file
            // input event racing this save) and against duplicates that
            // were only added to the DB after the file was selected.
            if (!window.editingId) {
                const stashedHash = fileInput.dataset.fileHash || null;
                const dupe = await findMatchingEntry(file, stashedHash);
                if (dupe) {
                    alert("Diese Datei ist bereits gespeichert (als „" + (dupe.thema || dupe.fileName || 'vorhandener Eintrag') + "\"). Bitte bearbeiten Sie den vorhandenen Eintrag.");
                    if (saveBtn) saveBtn.style.pointerEvents = 'auto';
                    if (saveText) saveText.textContent = 'SPEICHERN';
                    if (saveProgress) { saveProgress.style.width = '0%'; }
                    window.duplicateBlocked = true;
                    setSaveBtnEnabled(false);
                    showDuplicateNotice(document.getElementById('file-dup-status'), dupe);
                    return;
                }
            }
            const meta = { thema, lektion, buch, klassen, jahr, typ, subTyp };
            if (saveText && (isPdfFile(file.name, file.type) || isDocxFile(file.name, file.type))) {
                saveText.textContent = 'METADATEN WERDEN EINGEBETTET...';
            }
            const finalData = await embedMetadataIfApplicable(dataUrl, meta, file.name, file.type);
            if (saveProgress) saveProgress.style.width = '90%';
            persist(finalData, file.name, file.type, file.size, fileInput.dataset.fileHash || null);
        }

        if (fileInput.files.length > 0) {
            // Fast 0ms memory path: rawBuf was already read into memory during selection
            if (fileInput._cachedDataUrl && fileInput._cachedFileName === file.name && fileInput._cachedFileSize === file.size) {
                if (saveProgress) saveProgress.style.width = '80%';
                setTimeout(() => { processFileAndPersist(fileInput._cachedDataUrl); }, 30);
            } else {
                const reader = new FileReader();
                reader.onprogress = function(ev) {
                    if (ev.lengthComputable && saveProgress) {
                        const percentLoaded = Math.round((ev.loaded / ev.total) * 60) + 10;
                        saveProgress.style.width = percentLoaded + '%';
                    }
                };
                reader.onload = function(ev) {
                    if (saveProgress) saveProgress.style.width = '80%';
                    setTimeout(() => { processFileAndPersist(ev.target.result); }, 30);
                };
                reader.readAsDataURL(fileInput.files[0]);
            }
        } else {
            if (saveProgress) saveProgress.style.width = '50%';
            const txRead = idb.transaction(["documents"], "readonly");
            txRead.objectStore("documents").get(window.editingId).onsuccess = async (ev) => {
                const orig = ev.target.result;
                const meta = { thema, lektion, buch, klassen, jahr, typ, subTyp };
                // Re-embed so the stored copy always reflects the latest saved
                // info, even when the user only edited fields and kept the file.
                const finalData = await embedMetadataIfApplicable(orig.fileData, meta, orig.fileName || '', orig.fileType || '');
                persist(finalData, orig.fileName, orig.fileType, orig.fileSize, orig.fileHash);
            };
        }
    }

    // --- Dynamic Themes & Lessons Filter Linking ---
    function updateFilterThemenUndLektionen() {
        const buchSelect = document.getElementById('filter-buch');
        const themaSelect = document.getElementById('filter-thema');
        const lektionSelect = document.getElementById('filter-lektion');
        if (!themaSelect || !lektionSelect) return;

        const selectedBuch = buchSelect ? buchSelect.value.trim() : '';
        const prevThema = themaSelect.value;
        const prevLektion = lektionSelect.value;

        const knownThemes = new Set();
        let thOptions = '<option value="">Filter: ALLE THEMEN</option>';

        if (selectedBuch && typeof CURRICULUM_DATA !== 'undefined' && CURRICULUM_DATA[selectedBuch]) {
            const bData = CURRICULUM_DATA[selectedBuch];
            if (bData.themes && bData.themes.length > 0) {
                bData.themes.forEach(t => {
                    const val = t.title || t.fullTitle;
                    const label = t.fullTitle || t.title;
                    knownThemes.add(val.toLowerCase());
                    thOptions += `<option value="${escapeHtml(val)}">${escapeHtml(label)}</option>`;
                });
            }
        } else if (typeof CURRICULUM_DATA !== 'undefined') {
            for (const [bName, bData] of Object.entries(CURRICULUM_DATA)) {
                if (bName.includes('(') || bName.startsWith('Deutsch Na klar')) continue;
                if (bData.themes && bData.themes.length > 0) {
                    thOptions += `<optgroup label="${escapeHtml(bName)}">`;
                    bData.themes.forEach(t => {
                        const val = t.title || t.fullTitle;
                        const label = t.fullTitle || t.title;
                        knownThemes.add(val.toLowerCase());
                        thOptions += `<option value="${escapeHtml(val)}">${escapeHtml(label)}</option>`;
                    });
                    thOptions += `</optgroup>`;
                }
            }
        }

        // Include any custom themes stored in database
        if (window._dbUniqueThemes && window._dbUniqueThemes.length > 0) {
            const extras = window._dbUniqueThemes.filter(th => !knownThemes.has(th.toLowerCase()));
            if (extras.length > 0) {
                thOptions += `<optgroup label="── Weitere Themen (in DB) ──">`;
                extras.forEach(th => {
                    thOptions += `<option value="${escapeHtml(th)}">${escapeHtml(th)}</option>`;
                });
                thOptions += `</optgroup>`;
            }
        }

        themaSelect.innerHTML = thOptions;

        if (prevThema && Array.from(themaSelect.options).some(o => o.value === prevThema)) {
            themaSelect.value = prevThema;
        } else {
            themaSelect.value = '';
        }

        updateFilterLektionen(prevLektion);
    }

        const buchSelect = document.getElementById('filter-buch');
        const themaSelect = document.getElementById('filter-thema');
        const lektionSelect = document.getElementById('filter-lektion');
        if (!lektionSelect) return;

        const selectedBuch = buchSelect ? buchSelect.value.trim() : '';
        const selectedThema = themaSelect ? themaSelect.value.trim() : '';
        const targetLektion = (keepLektionVal !== undefined) ? keepLektionVal : lektionSelect.value;

        const knownLessons = new Set();
        let lOptions = '<option value="">Filter: ALLE LEKTIONEN</option>';

        if (selectedBuch && typeof CURRICULUM_DATA !== 'undefined' && CURRICULUM_DATA[selectedBuch]) {
            const bData = CURRICULUM_DATA[selectedBuch];
            if (selectedThema) {
                const th = bData.themes.find(t => (t.title === selectedThema || t.fullTitle === selectedThema));
                if (th && th.lessons && th.lessons.length > 0) {
                    th.lessons.forEach(les => {
                        knownLessons.add(les.toLowerCase());
                        lOptions += `<option value="${escapeHtml(les)}">${escapeHtml(les)}</option>`;
                    });
                }
            } else {
                bData.themes.forEach(t => {
                    if (t.lessons && t.lessons.length > 0) {
                        lOptions += `<optgroup label="${escapeHtml(t.fullTitle || t.title)}">`;
                        t.lessons.forEach(les => {
                            knownLessons.add(les.toLowerCase());
                            lOptions += `<option value="${escapeHtml(les)}">${escapeHtml(les)}</option>`;
                        });
                        lOptions += `</optgroup>`;
                    }
                });
            }
        } else if (typeof CURRICULUM_DATA !== 'undefined') {
            if (selectedThema) {
                for (const [bName, bData] of Object.entries(CURRICULUM_DATA)) {
                    if (bName.includes('(') || bName.startsWith('Deutsch Na klar')) continue;
                    const th = bData.themes.find(t => (t.title === selectedThema || t.fullTitle === selectedThema));
                    if (th && th.lessons && th.lessons.length > 0) {
                        lOptions += `<optgroup label="${escapeHtml(bName + ': ' + (th.fullTitle || th.title))}">`;
                        th.lessons.forEach(les => {
                            knownLessons.add(les.toLowerCase());
                            lOptions += `<option value="${escapeHtml(les)}">${escapeHtml(les)}</option>`;
                        });
                        lOptions += `</optgroup>`;
                    }
                }
            } else {
                for (const [bName, bData] of Object.entries(CURRICULUM_DATA)) {
                    if (bName.includes('(') || bName.startsWith('Deutsch Na klar')) continue;
                    if (bData.themes && bData.themes.length > 0) {
                        bData.themes.forEach(t => {
                            if (t.lessons && t.lessons.length > 0) {
                                lOptions += `<optgroup label="${escapeHtml(bName + ' – ' + (t.fullTitle || t.title))}">`;
                                t.lessons.forEach(les => {
                                    knownLessons.add(les.toLowerCase());
                                    lOptions += `<option value="${escapeHtml(les)}">${escapeHtml(les)}</option>`;
                                });
                                lOptions += `</optgroup>`;
                            }
                        });
                    }
                }
            }
        }

        // Include any custom lessons from DB
        if (window._dbUniqueLessons && window._dbUniqueLessons.length > 0) {
            const extraLes = window._dbUniqueLessons.filter(les => !knownLessons.has(les.toLowerCase()));
            if (extraLes.length > 0) {

                extraLes.forEach(les => {
                    lOptions += `<option value="${escapeHtml(les)}">${escapeHtml(les)}</option>`;
                });
                lOptions += `</optgroup>`;
            }
        }

        lektionSelect.innerHTML = lOptions;

        if (targetLektion && Array.from(lektionSelect.options).some(o => o.value === targetLektion)) {
            lektionSelect.value = targetLektion;
        } else {
            lektionSelect.value = '';
        }
    }

    function isDocAnUpdate(doc) {
        if (!doc) return false;
        if (doc.isSwarmImport || doc.isUpdated) return true;
        try {
            const stored = JSON.parse(localStorage.getItem('p2p_updated_docs') || '[]');
            const docHash = (doc.fileHash || '').toLowerCase().trim();
            const docId = Number(doc.id) || 0;
            return stored.some(s => (docId > 0 && Number(s.id) === docId) || (docHash && s.hash && s.hash.toLowerCase() === docHash));
        } catch (e) {
            return false;
        }
    }

    function renderResults() {
        if (!idb) {

    // Helper function for PDF.js (Pulled OUTSIDE of openModal)
    
    // Robust PDF.js Worker Configuration & Safe Document Loader
    function ensurePdfWorkerConfigured(pdfjsLib) {
        if (!pdfjsLib) return;
        let workerUrl = 'lib/pdf/v1/pdf.worker.min.js';
        const scripts = Array.from(document.querySelectorAll('script[src]'));
        const workerScript = scripts.find(s => s.src && s.src.includes('pdf.worker'));
        const mainScript = scripts.find(s => s.src && s.src.includes('pdf.min.js'));
        if (workerScript && workerScript.src) {
            workerUrl = workerScript.src;
        } else if (mainScript && mainScript.src) {
            workerUrl = mainScript.src.replace('pdf.min.js', 'pdf.worker.min.js');
        } else if (window.location.origin && window.location.origin.includes('github.io')) {
            workerUrl = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
        }
        if (pdfjsLib.GlobalWorkerOptions) {
            pdfjsLib.GlobalWorkerOptions.workerSrc = workerUrl;
        }
    }

    async function loadPdfDocumentSafe(pdfjsLib, bytes) {
        ensurePdfWorkerConfigured(pdfjsLib);
        try {
            const loadingTask = pdfjsLib.getDocument({ data: bytes, isEvalSupported: false });
            return await loadingTask.promise;
        } catch (workerErr) {
            console.warn('[PDF.js] Primary worker loading error, retrying with CDN fallback:', workerErr);
            if (pdfjsLib.GlobalWorkerOptions) {
                pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
            }
            const fallbackTask = pdfjsLib.getDocument({ data: bytes, isEvalSupported: false });
            return await fallbackTask.promise;
        }
    }

    async function renderPdfMobileFriendly(base64Data) {
        await window.OSIRIS_LIBS_READY;
        const container = document.getElementById('pdf-canvas-container');
        if (!container) return;
        
        try {
            const rawB64 = (base64Data && base64Data.includes(',')) ? base64Data.split(',')[1] : (base64Data || '');
            const binaryString = atob(rawB64.replace(/\s+/g, ''));
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) { bytes[i] = binaryString.charCodeAt(i); }

            const pdfjsLib = window['pdfjs-dist/build/pdf'] || window.pdfjsLib;
            if (!pdfjsLib) {
                throw new Error('PDF.js Bibliothek konnte nicht geladen werden.');
            }

            const pdf = await loadPdfDocumentSafe(pdfjsLib, bytes);
            container.innerHTML = ''; // Clear loading text

            // Render every page
            for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                const page = await pdf.getPage(pageNum);
                const viewport = page.getViewport({scale: 1.5}); // Increase scale for clarity
                
                const canvas = document.createElement('canvas');
                canvas.className = 'pdf-page-canvas';
                const context = canvas.getContext('2d');
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                await page.render({canvasContext: context, viewport: viewport}).promise;
                container.appendChild(canvas);
            }
        } catch (err) {
            container.innerHTML = `<div style="color:red; padding:20px;">PDF konnte nicht geladen werden: ${escapeHtml(err.message || err)}</div>`;
            console.error('PDF Render Error:', err);
        }
    }

    function importDB(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async function(e) {
            try {
                await window.OSIRIS_LIBS_READY;
                const parsed = safeJsonParse(e.target.result);
                // Support both full DB array [...] and single .edu.json package { app: 'OsirisEduHub', document: {...} }
                let rawList = [];
                if (Array.isArray(parsed)) {
                    rawList = parsed;
                } else if (parsed && parsed.app === 'OsirisEduHub' && parsed.document) {
                    rawList = [parsed.document];
                } else {
                    alert("Ungültiges JSON Format.");
                    return;
                }

                const validEntries = [];
                let blockedCount = 0;

                for (const rawItem of rawList) {
                    const cleanItem = window.OsirisSecurity ? window.OsirisSecurity.sanitizeDocRecord(rawItem) : rawItem;
                    if (!cleanItem || !cleanItem.fileData) { blockedCount++; continue; }
                    if (window.OsirisSecurity) {
                        try {
                            const b64 = cleanItem.fileData.split(',')[1] || '';
                            const bin = atob(b64);
                            const u8 = new Uint8Array(bin.length);
                            for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
                            const check = window.OsirisSecurity.validateMagicBytes(u8, cleanItem.fileName);
                            if (!check.valid) {
                                console.warn('[Osiris Security] Blocked unsafe entry during JSON import:', cleanItem.fileName, check.reason);
                                blockedCount++;
                                continue;
                            }
                            if (!cleanItem.fileHash) {
                                cleanItem.fileHash = await window.OsirisSecurity.computeSHA256(u8.buffer);
                            }
                        } catch (err) {
                            blockedCount++;
                            continue;
                        }
                    }
                    validEntries.push(cleanItem);
                }

                if (validEntries.length === 0) {
                    alert("🛑 Import abgebrochen: Keine sicheren oder gültigen Dokumente in der Datei gefunden.");
                    return;
                }

                const tx = idb.transaction(["documents"], "readwrite");
                const store = tx.objectStore("documents");
                validEntries.forEach(item => store.put(item));
                tx.oncomplete = () => {
                    if (isSwarmAutoShareEnabled()) { validEntries.forEach(item => autoShareToSwarm(item)); }
                    const msg = blockedCount > 0
                        ? `${validEntries.length} Dokument(e) importiert (${blockedCount} unsichere Einträge blockiert).`
                        : `Datenbank erfolgreich geprüft und importiert (${validEntries.length} Dokument(e))!`;
                    alert(msg);
                    renderResults();
                };
            } catch (err) { alert("Fehler beim Lesen oder Prüfen der Datei."); }
        };
        reader.readAsText(file);
        event.target.value = '';
    }

    function addLink() {
        const name = document.getElementById('link-name').value.trim().substring(0, 100);
        const rawUrl = document.getElementById('link-url').value.trim();

        const safeHref = sanitizeUrl(rawUrl);

            alert('Ungültige URL! Bitte geben Sie eine gültige https:// oder http:// Adresse ein.');
            return;
        }
        links.push({ name, url: safeHref });
        localStorage.setItem('bank_links', JSON.stringify(links));
        document.getElementById('link-name').value = ''; document.getElementById('link-url').value = '';
        renderLinksList();
    }

    function removeLink(idx) {
        links.splice(Number(idx), 1);
        localStorage.setItem('bank_links', JSON.stringify(links));
        renderLinksList();
    }

    function renderLinksList() {
        const list = document.getElementById('pop-links-list');
        list.innerHTML = '';
        links.forEach((l, idx) => {
            const div = document.createElement('div');
            div.style.display = 'flex'; div.style.justifyContent = 'space-between'; div.style.marginBottom = '5px';
            const safeHref = sanitizeUrl(l.url);
            const safeName = escapeHtml(l.name);
            div.innerHTML = `<a href="${safeHref}" target="_blank" rel="noopener noreferrer" style="color:var(--text); text-decoration:none; font-weight:bold; max-width:85%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${safeName}</a>
                             <span onclick="removeLink(${Number(idx)})" style="cursor:pointer; color:red; font-weight:bold;">✖</span>`;
            list.appendChild(div);
        });
        updateTicker();
    }

    function updateTicker() {
        const ticker = document.getElementById('footer-ticker');
        ticker.innerHTML = '';
        if (links.length === 0) {
            ticker.innerHTML = `<span>Fügen Sie Ihre Lieblingslinks hinzu, um sie hier durchlaufen zu sehen!</span>`; return;
        }
        const pool = [...links, ...links, ...links];
        pool.forEach(l => {
            const span = document.createElement('span'); span.style.margin = '0 25px';
            const safeHref = sanitizeUrl(l.url);
            const safeName = escapeHtml(l.name);
            span.innerHTML = `<a href="${safeHref}" target="_blank" rel="noopener noreferrer" style="color:var(--primary); text-decoration:none; font-weight:bold;">${safeName}</a>`;
            ticker.appendChild(span);
        });
    }

    // Global Click Listener
    document.addEventListener('click', function(event) {
        const linksPop = document.getElementById('links-pop');
        if (linksPop.style.display === 'block' && !linksPop.contains(event.target) && event.target.id !== 'links-toggle-btn') {
            linksPop.style.display = 'none';
        }
    });

    updateTicker();

    // --- Share Button Logic ---
    function toggleSharePopup(e) {
        if (e) e.stopPropagation();
        const popup = document.getElementById('share-popup');
        const shareBtn = document.getElementById('btn-share');
        const isVisible = popup.classList.contains('visible');
        if (isVisible) {
            popup.classList.remove('visible');
            if (window.shareAutoHideTimer) clearTimeout(window.shareAutoHideTimer);
        } else {
            if (shareBtn) {
                const rect = shareBtn.getBoundingClientRect();
                popup.style.bottom = (window.innerHeight - rect.top + 10) + 'px';
                popup.style.right = Math.max(10, (window.innerWidth - rect.right)) + 'px';
            }
            const doc = window._currentModalDoc;
            const curSize = (doc && (Number(doc.fileSize) || (doc.fileData ? Math.round(doc.fileData.length * 0.75) : 0))) || 0;
            const swarmBtn = document.getElementById('btn-share-swarm');
            const swarmText = document.getElementById('swarm-share-text');
            const limitBytes = 10 * 1024 * 1024; // 10 MB

            if (swarmBtn) {
                if (curSize > limitBytes) {
                    const sizeMb = (curSize / (1024 * 1024)).toFixed(1);
                    swarmBtn.disabled = true;
                    swarmBtn.style.opacity = '0.45';
                    swarmBtn.style.cursor = 'not-allowed';
                    swarmBtn.title = `P2P-Schwarm-Limit: Maximal 10 MB erlaubt (aktuelle Datei: ${sizeMb} MB). Bitte per Bluetooth, E-Mail oder WhatsApp teilen.`;
                    if (swarmText) {
                        swarmText.innerHTML = `In Community-Schwarm teilen <span style="font-size:0.75rem; color:#dc2626; display:block; font-weight:normal;">(> 10 MB gesperrt · ${sizeMb} MB)</span>`;
                    }
                } else {
                    swarmBtn.disabled = false;
                    swarmBtn.style.opacity = '1';
                    swarmBtn.style.cursor = 'pointer';
                    swarmBtn.title = 'In Community-Schwarm teilen (P2P)';
                    if (swarmText) {
                        swarmText.textContent = 'In Community-Schwarm teilen';
                    }
                }
            }

            popup.classList.add('visible');
            // Auto-close popup after 4 seconds
            if (window.shareAutoHideTimer) clearTimeout(window.shareAutoHideTimer);
            window.shareAutoHideTimer = setTimeout(() => {
                popup.classList.remove('visible');
            }, 4000);
        }
    }

    // Close popup if clicking outside
    document.getElementById('fs-modal').addEventListener('click', function(e) {
        const popup = document.getElementById('share-popup');
        const shareBtn = document.getElementById('btn-share');
        if (popup.classList.contains('visible') && !popup.contains(e.target) && e.target !== shareBtn && !shareBtn.contains(e.target)) {
            popup.classList.remove('visible');
            if (window.shareAutoHideTimer) clearTimeout(window.shareAutoHideTimer);
        }
    });

    
    // --- Offline PDF to Word (DOCX) Converter ---
    async function convertCurrentPdfToDocx(event) {
        if (event) {
            event.preventDefault();
            event.stopPropagation();
        }
        const item = window._currentModalDoc;
        if (!item || !item.fileData) {
            alert('Kein Dokument geladen.');
            return;
        }

        const btn = document.getElementById('btn-pdf-to-docx');
        const btnText = document.getElementById('btn-pdf-to-docx-text');
        const originalText = btnText ? btnText.textContent : 'WORD (DOCX)';

        const setStatus = (txt) => {
            if (btnText) btnText.textContent = txt;
        };

        try {
            if (btn) btn.disabled = true;
            setStatus('LADE BIBLIOTHEKEN...');

            await window.OSIRIS_LIBS_READY;

            const pdfjsLib = window['pdfjs-dist/build/pdf'] || window.pdfjsLib;
            if (!pdfjsLib) {
                throw new Error('PDF.js Bibliothek nicht verfügbar.');
            }
            if (typeof window.htmlDocx === 'undefined') {
                throw new Error('Word-Konverter (htmlDocx) nicht verfügbar.');
            }

            setStatus('LESE PDF-DATEN...');
            const base64Str = item.fileData.includes(',') ? item.fileData.split(',')[1] : item.fileData;
            const binaryStr = atob(base64Str);
            const bytes = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) {
                bytes[i] = binaryStr.charCodeAt(i);
            }

            pdfjsLib.GlobalWorkerOptions.workerSrc = 'lib/pdf/v1/pdf.worker.min.js';
            const pdf = await pdfjsLib.getDocument({ data: bytes, isEvalSupported: false }).promise;
            const totalPages = pdf.numPages;

            let bodyContentHtml = '';

            for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
                setStatus(`SEITE ${pageNum}/${totalPages}...`);
                const page = await pdf.getPage(pageNum);
                const textContent = await page.getTextContent();

                if (pageNum > 1) {
                    bodyContentHtml += `<div style="page-break-before: always; height: 1px; border-top: 1px dashed #cbd5e1; margin: 24pt 0 16pt 0;"></div>`;
                }

                if (!textContent || !textContent.items || textContent.items.length === 0) {
                    bodyContentHtml += `<p style="font-style:italic; color:#64748b;">(Seite ${pageNum}: Keine Textinhalte erkannt)</p>`;
                    continue;
                }

                const rawItems = textContent.items
                    .filter(it => it.str && it.str.trim().length > 0)
                    .map(it => {
                        const x = it.transform ? it.transform[4] : 0;
                        const y = it.transform ? it.transform[5] : 0;
                        const size = Math.abs(it.transform ? it.transform[3] : 0) || it.height || 11;
                        return { str: it.str, x, y, size, width: it.width || 0 };
                    });

                if (rawItems.length === 0) {
                    bodyContentHtml += `<p style="font-style:italic; color:#64748b;">(Seite ${pageNum}: Keine Textinhalte erkannt)</p>`;
                    continue;
                }

                rawItems.sort((a, b) => b.y - a.y || a.x - b.x);
                const avgSize = rawItems.reduce((acc, it) => acc + it.size, 0) / rawItems.length;

                const lines = [];
                let curLine = { y: rawItems[0].y, items: [rawItems[0]], maxSize: rawItems[0].size };

                for (let i = 1; i < rawItems.length; i++) {
                    const item_i = rawItems[i];
                    if (Math.abs(curLine.y - item_i.y) <= 3.5) {
                        curLine.items.push(item_i);
                        if (item_i.size > curLine.maxSize) curLine.maxSize = item_i.size;
                    } else {
                        curLine.items.sort((a, b) => a.x - b.x);
                        lines.push(curLine);
                        curLine = { y: item_i.y, items: [item_i], maxSize: item_i.size };
                    }
                }
                if (curLine.items.length > 0) {
                    curLine.items.sort((a, b) => a.x - b.x);
                    lines.push(curLine);
                }

                const processedLines = lines.map(line => {
                    let lineStr = '';
                    let lastRight = null;
                    for (const piece of line.items) {
                        if (lastRight !== null) {
                            const gap = piece.x - lastRight;
                            if (gap > 2 && !lineStr.endsWith(' ') && !piece.str.startsWith(' ')) {
                                lineStr += ' ';
                            }
                        }
                        lineStr += piece.str;
                        lastRight = piece.x + piece.width;
                    }
                    return {
                        text: lineStr.trim(),
                        y: line.y,
                        size: line.maxSize
                    };
                }).filter(l => l.text.length > 0);

                for (let i = 0; i < processedLines.length; i++) {
                    const cur = processedLines[i];
                    const safeText = escapeHtml(cur.text);

                    if (cur.size >= avgSize * 1.35 && cur.text.length < 90) {
                        bodyContentHtml += `<h2 style="font-size: 14pt; color: #1f4e79; margin-top: 14pt; margin-bottom: 6pt; font-weight: bold;">${safeText}</h2>`;
                    } else if (cur.size >= avgSize * 1.18 && cur.text.length < 110) {
                        bodyContentHtml += `<h3 style="font-size: 12pt; color: #2e75b6; margin-top: 10pt; margin-bottom: 4pt; font-weight: bold;">${safeText}</h3>`;
                    } else {
                        bodyContentHtml += `<p style="font-size: 11pt; line-height: 1.25; margin-bottom: 5pt; text-align: justify;">${safeText}</p>`;
                    }
                }
            }

            setStatus('ERSTELLE DOCX...');

            const themaTitle = escapeHtml(item.thema || 'Dokument');
            const typLabel = escapeHtml(item.typ || 'Unterrichtsmaterial');
            const klassenLabel = escapeHtml(item.klassen || '-');
            const buchLabel = escapeHtml(item.buch || '-');
            const lektionLabel = escapeHtml(item.lektion || '-');
            const jahrLabel = escapeHtml(item.jahr || new Date().getFullYear().toString());
            const dateLabel = escapeHtml(item.date || new Date().toLocaleDateString('de-DE'));

            const metaHeaderHtml = `
                <table style="width: 100%; border-collapse: collapse; margin-bottom: 20pt; font-family: Calibri, Arial, sans-serif; border-bottom: 2pt solid #1f4e79;">
                    <tr>
                        <td style="padding: 8pt 0; vertical-align: top;">
                            <div style="font-size: 18pt; font-weight: bold; color: #1f4e79; margin-bottom: 4pt;">${themaTitle}</div>
                            <div style="font-size: 11pt; color: #555555;">Typ: <strong>${typLabel}</strong> | Klassenstufe: <strong>${klassenLabel}</strong></div>
                        </td>
                        <td style="text-align: right; padding: 8pt 0; vertical-align: top; font-size: 9.5pt; color: #666666;">
                            <div>Lehrwerk: <strong>${buchLabel}</strong></div>
                            <div>Lektion/Modul: <strong>${lektionLabel}</strong></div>
                            <div>Schuljahr: <strong>${jahrLabel}</strong> | Erstellt: ${dateLabel}</div>
                        </td>
                    </tr>
                </table>
            `;

            const fullHtml = `<!DOCTYPE html>
            <html>
            <head>
                <meta charset="utf-8">
                <title>${themaTitle}</title>
                <style>
                    body { font-family: Calibri, 'Segoe UI', Arial, sans-serif; font-size: 11pt; line-height: 1.25; color: #1a1a1a; }
                    h1, h2, h3, h4 { font-family: Calibri, 'Segoe UI', Arial, sans-serif; }
                    p { margin: 0 0 5pt 0; }
                    table { border-collapse: collapse; }
                </style>
            </head>
            <body>
                ${metaHeaderHtml}
                ${bodyContentHtml}
            </body>
            </html>`;

            const docxBlob = window.htmlDocx.asBlob(fullHtml);

            let baseName = (item.fileName || 'Dokument').replace(/\.pdf$/i, '');
            if (!baseName.endsWith('.docx')) baseName += '.docx';

            const blobUrl = URL.createObjectURL(docxBlob);
            const a = document.createElement('a');
            a.href = blobUrl;
            a.download = baseName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(blobUrl), 10000);

            setStatus('FERTIG! (HERUNTERGELADEN)');
            setTimeout(() => {
                setStatus(originalText);
                if (btn) btn.disabled = false;
            }, 2500);

        } catch (err) {
            console.error('PDF to Word conversion failed:', err);
            alert('Fehler bei der PDF-zu-Word-Konvertierung: ' + (err.message || err));
            setStatus(originalText);
            if (btn) btn.disabled = false;
        }
    }

    async function shareVia(platform, event) {
        if (event) event.stopPropagation();
        if (platform === 'swarm') {
            const popup = document.getElementById('share-popup');
            if (popup) popup.classList.remove('visible');
            if (window.shareAutoHideTimer) clearTimeout(window.shareAutoHideTimer);

            if (typeof toggleCurrentDocSwarmShare === 'function') {
                await toggleCurrentDocSwarmShare(event);
            }
            openSwarmDirect(event, 'local');
            return;
        }
        const popup = document.getElementById('share-popup');
        popup.classList.remove('visible');
        if (window.shareAutoHideTimer) clearTimeout(window.shareAutoHideTimer);

        if (window.EduHybridShare && window._currentModalDoc) {
            EduHybridShare.shareSocial(platform, window._currentModalDoc);
            return;
        }

        const fileName = window._shareFileName || 'Dokument';
        const fileData = window._shareFileData || '';
        const fileType = window._shareFileType || 'application/octet-stream';
        const msgText = 'Dokument: ' + fileName;

        if (platform === 'whatsapp') {
            window.open('https://api.whatsapp.com/send?text=' + encodeURIComponent(msgText), '_blank');

        } else if (platform === 'telegram') {
            window.open('https://t.me/share/url?url=' + encodeURIComponent(window.location.href) + '&text=' + encodeURIComponent(msgText), '_blank');

        } else if (platform === 'email') {
            window.location.href = 'mailto:?subject=' + encodeURIComponent(fileName) + '&body=' + encodeURIComponent(msgText);

        } else if (platform === 'bluetooth') {
            // Use Web Share API (works on mobile for Bluetooth/NFC/etc.)
            if (fileData && navigator.canShare) {
                try {
                    // Convert base64 data URL to a File object
                    const arr = fileData.split(',');
                    const mime = arr[0].match(/:(.*?);/)[1];
                    const bstr = atob(arr[1]);
                    const n = bstr.length;
                    const u8arr = new Uint8Array(n);
                    for (let i = 0; i < n; i++) u8arr[i] = bstr.charCodeAt(i);
                    const file = new File([u8arr], fileName, { type: mime });

                    if (navigator.canShare({ files: [file] })) {
                        navigator.share({ files: [file], title: fileName })
                            .catch(err => { if (err.name !== 'AbortError') alert('Teilen fehlgeschlagen: ' + err.message); });
                    } else {
                        navigator.share({ title: fileName, text: msgText })
                            .catch(err => { if (err.name !== 'AbortError') alert('Teilen fehlgeschlagen: ' + err.message); });
                    }
                } catch (err) {
                    alert('Bluetooth-Teilen wird von diesem Browser nicht unterstützt.');
                }
            } else if (navigator.share) {
                navigator.share({ title: fileName, text: msgText })
                    .catch(err => { if (err.name !== 'AbortError') alert('Teilen fehlgeschlagen: ' + err.message); });
            } else {
                alert('Teilen wird von diesem Browser nicht unterstützt. Bitte verwenden Sie einen mobilen Browser.');
            }
        }
    }

</script>
