<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <!-- Open Book Group with Drop Shadow -->
  <g filter="url(#shadow)">
    <!-- Left Page -->
    <path d="M 250 375 L 105 405 C 92 407 80 398 80 385 L 80 185 C 80 174 90 166 101 168 L 250 205 Z" fill="#e2e8f0"/>
    <!-- Right Page -->
    <path d="M 262 375 L 407 405 C 420 407 432 398 432 385 L 432 185 C 432 174 422 166 411 168 L 262 205 Z" fill="#f8fafc"/>
    <!-- Page text lines left -->
    <line x1="115" y1="230" x2="225" y2="245" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
    <line x1="115" y1="275" x2="225" y2="290" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
    <line x1="115" y1="320" x2="205" y2="332" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
    <!-- Page text lines right -->
    <line x1="287" y1="245" x2="397" y2="230" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
    <line x1="287" y1="290" x2="397" y2="275" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
    <line x1="287" y1="332" x2="377" y2="320" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
    <!-- Golden bookmark ribbon -->
    <polygon points="248,155 264,155 264,360 256,348 248,360" fill="#f59e0b"/>
  </g>
</svg>
