    /* ===== Sticker frame — draggable "API VAULT" popup ===== */
    .sticker-frame {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) rotate(var(--tilt, -3deg));
        width: min(92vw, 360px);
        max-height: 85vh;
        display: none;
        padding: 16px;
        background: var(--sticker-color, #d9ece6);
        border-radius: 22px;
        z-index: 201;
        overflow: hidden;
        box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5), 0 20px 34px rgba(0, 0, 0, 0.32);
        transition: background-color .4s ease, transform .4s cubic-bezier(.34,1.4,.64,1);
    }

    .sticker-frame.active { display: block; }

    .sticker-frame::after {
        content: "";
        position: absolute;
        top: 0; right: 0; width: 0; height: 0;
        border-style: solid;
        border-width: 0 34px 34px 0;
        border-color: transparent #fdfdf9 transparent transparent;
        filter: drop-shadow(-2px 2px 3px rgba(0, 0, 0, 0.28));
        z-index: 2;
        pointer-events: none;
    }

    .sticker-frame::before {
        content: "";
        position: absolute;
        bottom: 0; left: 0; width: 0; height: 0;
        border-style: solid;
        border-width: 34px 0 0 34px;
        border-color: transparent transparent transparent #fdfdf9;
        filter: drop-shadow(2px -2px 3px rgba(0, 0, 0, 0.28));
        z-index: 2;
        pointer-events: none;
    }

    .submenu {
        background-color: var(--submenu-color, var(--bg-color));
        border: 1px solid var(--border-color);
        border-radius: 10px;
        max-height: calc(85vh - 32px);
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        cursor: default;
        padding: 16px;
        position: relative;
        z-index: 1;
        box-shadow: -3px -3px 0 0 #fdfdf9, 3px 3px 0 0 #fdfdf9;
        transition: background-color .4s ease;
    }

    .submenu-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
        cursor: grab;
        touch-action: none;
    }
    .submenu-header.dragging { cursor: grabbing; }

    .submenu-header h3 { font-size: 15px; letter-spacing: 1px; color: var(--text-color); }

    .header-actions { display: flex; align-items: center; gap: 10px; }

    .icon-btn {
        background: none; border: none; cursor: pointer;
        font-size: 15px; line-height: 1; color: var(--text-secondary);
        padding: 2px;
    }
    .icon-btn:hover { color: var(--text-color); }

    .submenu-close { background: none; border: none; cursor: pointer; color: var(--text-secondary); font-size: 17px; line-height: 1; }

    /* ---- Lock view ---- */
    #lock-view { display: flex; flex-direction: column; gap: 10px; }
    .lock-hint { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }
    #passphrase-input {
        font-size: 22px; letter-spacing: 10px; text-align: center;
        padding: 10px; border: 1px solid var(--border-color); border-radius: 8px;
        outline: none; background: var(--surface-color); color: var(--text-color);
    }
    .warning-box {
        font-size: 11px; color: #a15c00; background: #fff3cd;
        border: 1px solid #ffe08a; border-radius: 6px; padding: 8px 10px;
        display: none;
    }
    .warning-box.show { display: block; }
    .btn-primary {
        font-size: 13px; font-weight: bold; padding: 10px; border: none;
        border-radius: 8px; background: var(--accent-color); color: #fff; cursor: pointer;
    }
    .btn-primary:hover { opacity: 0.9; }
    .status-msg { font-size: 11px; min-height: 14px; color: #c0392b; }
    .status-msg.ok { color: #1e7e34; }

    /* ---- Manage view ---- */
    #manage-view { display: flex; flex-direction: column; gap: 12px; }

    .vault-list { display: flex; flex-direction: column; gap: 6px; }
    .vault-row {
        display: flex; align-items: center; gap: 8px;
        padding: 8px 10px; border-radius: 8px; cursor: pointer;
        border: 1px solid var(--border-color); background: var(--surface-color);
        font-size: 13px; color: var(--text-color);
    }
    .vault-row:hover { background: var(--hover-color); }
    .vault-row.selected { border-color: var(--accent-color); background: #eaf2fe; }
    .vault-row-icon { width: 18px; height: 18px; flex-shrink: 0; object-fit: contain; }
    .vault-row-icon-fallback { display: none; font-size: 15px; }
    .vault-row-name { flex: 1; }
    .vault-row-count { font-size: 10px; color: var(--text-secondary); }

    .add-vault-btn {
        font-size: 12px; padding: 8px; border: 1px dashed var(--border-color);
        border-radius: 8px; background: none; cursor: pointer; color: var(--text-secondary);
    }
    .add-vault-btn:hover { background: var(--hover-color); }

    .vault-toolbar {
        display: flex; align-items: center; gap: 10px;
        padding-top: 8px; border-top: 1px solid var(--border-color);
    }
    .vault-toolbar.hidden { display: none; }
    .vault-toolbar .icon-btn { font-size: 17px; }
    .apply-keys-btn {
        margin-left: auto; font-size: 12px; font-weight: bold;
        padding: 9px 16px; border: none; border-radius: 999px;
        background: #1c1c1e; color: #fff; cursor: pointer;
    }
    .apply-keys-btn:hover { opacity: 0.88; }

    /* ---- Edit panel ---- */
    .edit-panel { display: flex; flex-direction: column; gap: 10px; padding-top: 10px; border-top: 1px solid var(--border-color); }
    .edit-panel.hidden { display: none; }
    .edit-panel h4 { font-size: 12px; color: var(--accent-color); }

    .key-list { display: flex; flex-direction: column; gap: 6px; max-height: 140px; overflow-y: auto; }
    .key-row {
        display: flex; align-items: center; gap: 8px; font-size: 11px;
        background: var(--surface-color); border-radius: 6px; padding: 6px 8px;
    }
    .key-row .kr-provider { font-weight: bold; flex-shrink: 0; }
    .key-row .kr-email { color: var(--text-secondary); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .key-row .kr-remove { background: none; border: none; cursor: pointer; color: #c0392b; font-size: 12px; }

    .key-form { display: flex; flex-direction: column; gap: 6px; }
    .key-form select, .key-form input {
        font-size: 12px; padding: 7px 8px; border: 1px solid var(--border-color);
        border-radius: 6px; background: var(--bg-color); color: var(--text-color); outline: none;
    }
    .key-form button, .footer-menu button {
        font-size: 11px; padding: 7px; border: 1px solid var(--border-color);
        border-radius: 6px; background: var(--surface-color); cursor: pointer; color: var(--text-color);
    }
    .key-form button:hover, .footer-menu button:hover { background: var(--hover-color); }

    .footer-menu { display: flex; gap: 6px; padding-top: 8px; border-top: 1px dashed var(--border-color); }
    .footer-menu input { flex: 1; font-size: 11px; padding: 7px 8px; border: 1px solid var(--border-color); border-radius: 6px; }
</style>

<script>
/* =====================================================================
   MEIN KI-SAFE — Osiris API Vault
   Ein einziges Passphrase (4 Ziffern) sichert alle Vaults gemeinsam.
   Verschlüsselung: identische Logik wie in API_DEPRECATION_CHECKER.html
   (PBKDF2 -> AES-GCM), zur Konsistenz im gesamten Osiris-Projekt.
   ===================================================================== */

const STORE_KEY = 'ki_safe_vault_store';       // verschlüsselter Blob (localStorage)
const PROVIDERS_KEY = 'ki_safe_providers';      // Anbieterliste, unverschlüsselt (kein Geheimnis)
const DEFAULT_PROVIDERS = ['Pollinations AI', 'OpenRouter', 'Groq', 'Google Gemini', 'GitHub Models'];

/* ---- Crypto-Hilfsfunktionen (identisch zu API_DEPRECATION_CHECKER.html) ---- */
function b64FromBytes(bytes){
  let bin = '';
  bytes.forEach(b=> bin += String.fromCharCode(b));
  return btoa(bin);
}
function bytesFromB64(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
async function deriveVaultKey(passphrase, saltBytes){
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey('raw', enc.encode(passphrase), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt: saltBytes, iterations: 150000, hash:'SHA-256'},
    baseKey, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']
  );
}
async function encryptVault(passphrase, data){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveVaultKey(passphrase, salt);
  const enc = new TextEncoder();
  const ciphertext = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, enc.encode(JSON.stringify(data)));
  return {v:1, salt: b64FromBytes(salt), iv: b64FromBytes(iv), ct: b64FromBytes(new Uint8Array(ciphertext))};
}
async function decryptVault(passphrase, blob){
  const key = await deriveVaultKey(passphrase, bytesFromB64(blob.salt));
  const plainBuf = await crypto.subtle.decrypt({name:'AES-GCM', iv: bytesFromB64(blob.iv)}, key, bytesFromB64(blob.ct));
  return JSON.parse(new TextDecoder().decode(plainBuf));
}

/* ---- App-Zustand ----
   failCount lebt nur im Speicher (kein localStorage/sessionStorage) und
   wird daher bei jedem Neuladen/Schließen automatisch zurückgesetzt —
   gewollt: ohne Passphrase-Wiederherstellung soll der Nutzer nach einer
   Pause eine neue Chance bekommen, statt endgültig ausgesperrt zu werden. */
let vaults = [];              // [{id, name, keys:[{provider, key, email}]}]
let unlockedPassphrase = null; // nur im Speicher, nie gespeichert
let selectedVaultId = null;
let failCount = 0;

function loadProviders(){
  try{
    const raw = localStorage.getItem(PROVIDERS_KEY);
    return raw ? JSON.parse(raw) : DEFAULT_PROVIDERS.slice();
  }catch(e){ return DEFAULT_PROVIDERS.slice(); }
}
function saveProviders(list){
  try{ localStorage.setItem(PROVIDERS_KEY, JSON.stringify(list)); }catch(e){}
}
let providers = loadProviders();

function hasStore(){
  try{ return !!localStorage.getItem(STORE_KEY); }catch(e){ return false; }
}
function loadStoreBlob(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
async function persistVaults(){
  const blob = await encryptVault(unlockedPassphrase, vaults);
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(blob)); }catch(e){ /* storage unavailable */ }
}
function wipeStore(){
  try{ localStorage.removeItem(STORE_KEY); }catch(e){}
  vaults = [];
  unlockedPassphrase = null;
  selectedVaultId = null;
  failCount = 0;
}

/* ---- DOM refs ---- */
const lockView = document.getElementById('lock-view');
const manageView = document.getElementById('manage-view');
const lockHint = document.getElementById('lock-hint');
const passInput = document.getElementById('passphrase-input');
const warningBox = document.getElementById('warning-box');
const unlockBtn = document.getElementById('unlock-btn');
const lockStatus = document.getElementById('lock-status');
const vaultListEl = document.getElementById('vault-list');
const addVaultBtn = document.getElementById('add-vault-btn');
const vaultToolbar = document.getElementById('vault-toolbar');
const editPanel = document.getElementById('edit-panel');
const editVaultName = document.getElementById('edit-vault-name');
const keyListEl = document.getElementById('key-list');
const providerSelect = document.getElementById('provider-select');
const keyInput = document.getElementById('key-input');
const emailInput = document.getElementById('email-input');
const importFileInput = document.getElementById('import-file-input');

function setLockStatus(msg, ok){
  lockStatus.textContent = msg || '';
  lockStatus.className = 'status-msg' + (ok ? ' ok' : '');
}

/* ---- Lock-View: Ersteinrichtung vs. Entsperren ---- */
function renderLockView(){
  passInput.value = '';
  setLockStatus('');
  if(hasStore()){
    lockHint.textContent = 'Passphrase eingeben, um die Vaults zu entsperren.';
    warningBox.classList.remove('show');
    unlockBtn.textContent = 'Entsperren';
  } else {
    lockHint.textContent = 'Noch kein Vault vorhanden. Legen Sie eine 4-stellige Passphrase fest, um zu beginnen.';
    warningBox.classList.add('show');
    unlockBtn.textContent = 'Vault erstellen';
  }
}

unlockBtn.addEventListener('click', async () => {
  const pass = passInput.value.trim();
  if(!/^[0-9]{4}$/.test(pass)){
    setLockStatus('Bitte eine 4-stellige Passphrase eingeben.', false);
    return;
  }
  if(!hasStore()){
    // Ersteinrichtung: neuer, leerer Vault-Speicher mit dieser Passphrase
    unlockedPassphrase = pass;
    vaults = [];
    await persistVaults();
    enterManageView();
    return;
  }
  // Vorhandenen Speicher entsperren
  const blob = loadStoreBlob();
  try{
    const decrypted = await decryptVault(pass, blob);
    vaults = Array.isArray(decrypted) ? decrypted : [];
    unlockedPassphrase = pass;
    failCount = 0;
    enterManageView();
  }catch(err){
    failCount++;
    if(failCount >= 3){
      wipeStore();
      setLockStatus('Alle Vaults wurden zurückgesetzt — erstellen Sie neue.', false);
      renderLockView();
    } else {
      setLockStatus(`Falsche Passphrase (Versuch ${failCount}/3).`, false);
    }
  }
});

/* ---- Manage-View ---- */
function enterManageView(){
  lockView.style.display = 'none';
  manageView.style.display = 'flex';
  selectedVaultId = null;
  renderVaultList();
  renderToolbarAndEditPanel();
  renderProviderSelect();
}

function backToLockView(){
  lockView.style.display = 'flex';
  manageView.style.display = 'none';
  unlockedPassphrase = null;
  vaults = [];
  selectedVaultId = null;
  renderLockView();
}

function renderVaultList(){
  vaultListEl.innerHTML = '';
  vaults.forEach(v => {
    const row = document.createElement('div');
    row.className = 'vault-row' + (v.id === selectedVaultId ? ' selected' : '');
    row.innerHTML = `
      <img src="Vault.svg" class="vault-row-icon" alt=""
           onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';">
      <span class="vault-row-icon-fallback">🔒</span>
      <span class="vault-row-name">${escapeHtml(v.name)}</span>
      <span class="vault-row-count">${v.keys.length} Schlüssel</span>
    `;
    row.addEventListener('click', () => {
      selectedVaultId = v.id;
      renderVaultList();
      renderToolbarAndEditPanel();
    });
    vaultListEl.appendChild(row);
  });
}

function selectedVault(){
  return vaults.find(v => v.id === selectedVaultId) || null;
}

function renderToolbarAndEditPanel(){
  const v = selectedVault();
  if(!v){
    vaultToolbar.classList.add('hidden');
    editPanel.classList.add('hidden');
    return;
  }
  vaultToolbar.classList.remove('hidden');
  editVaultName.textContent = v.name;
  renderKeyList();
}

function renderKeyList(){
  const v = selectedVault();
  keyListEl.innerHTML = '';
  if(!v) return;
  v.keys.forEach((k, idx) => {
    const row = document.createElement('div');
    row.className = 'key-row';
    row.innerHTML = `
      <span class="kr-provider">${escapeHtml(k.provider)}</span>
      <span class="kr-email">${escapeHtml(k.email || '')}</span>
      <button class="kr-remove" title="Entfernen">✕</button>
    `;
    row.querySelector('.kr-remove').addEventListener('click', async () => {
      v.keys.splice(idx, 1);
      await persistVaults();
      renderVaultList();
      renderKeyList();
    });
    keyListEl.appendChild(row);
  });
}

function renderProviderSelect(){
  providerSelect.innerHTML = providers.map(p => `<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join('');
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function nextVaultId(){
  return 'v_' + Date.now() + '_' + Math.floor(Math.random()*1000);
}

addVaultBtn.addEventListener('click', async () => {
  const id = nextVaultId();
  vaults.push({ id, name: `Vault ${vaults.length + 1}`, keys: [] });
  selectedVaultId = id;
  await persistVaults();
  renderVaultList();
  renderToolbarAndEditPanel();
});

document.getElementById('add-key-btn').addEventListener('click', async () => {
  const v = selectedVault();
  if(!v) return;
  const provider = providerSelect.value;
  const key = keyInput.value.trim();
  const email = emailInput.value.trim();
  if(!key){ return; }
  v.keys.push({ provider, key, email });
  keyInput.value = '';
  emailInput.value = '';
  await persistVaults();
  renderVaultList();
  renderKeyList();
});

document.getElementById('add-provider-btn').addEventListener('click', () => {
  const input = document.getElementById('new-provider-input');
  const name = input.value.trim();
  if(!name || providers.includes(name)) return;
  providers.push(name);
  saveProviders(providers);
  renderProviderSelect();
  input.value = '';
});

/* ---- Toolbar: bearbeiten / exportieren / importieren / löschen / anwenden ---- */
document.getElementById('tb-edit').addEventListener('click', () => {
  editPanel.classList.toggle('hidden');
});

document.getElementById('tb-export').addEventListener('click', async () => {
  const v = selectedVault();
  if(!v || !unlockedPassphrase) return;
  const blob = await encryptVault(unlockedPassphrase, { name: v.name, keys: v.keys });
  const a = document.createElement('a');
  const file = new Blob([JSON.stringify(blob, null, 2)], {type:'application/json'});
  a.href = URL.createObjectURL(file);
  a.download = v.name.replace(/\s+/g,'_') + '.vault.json';
  document.body.appendChild(a); a.click(); a.remove();
});

importFileInput.addEventListener('change', (e) => {
  const f = e.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try{
      const blob = JSON.parse(reader.result);
      const data = await decryptVault(unlockedPassphrase, blob);
      const id = nextVaultId();
      vaults.push({ id, name: data.name || `Vault ${vaults.length + 1}`, keys: Array.isArray(data.keys) ? data.keys : [] });
      selectedVaultId = id;
      await persistVaults();
      renderVaultList();
      renderToolbarAndEditPanel();
    }catch(err){
      alert('Import fehlgeschlagen — falsche Passphrase oder ungültige Datei.');
    }
    importFileInput.value = '';
  };
  reader.readAsText(f);
});
document.getElementById('tb-import').addEventListener('click', () => importFileInput.click());

document.getElementById('tb-reset').addEventListener('click', async () => {
  const v = selectedVault();
  if(!v) return;
  if(!confirm(`"${v.name}" wirklich löschen?`)) return;
  vaults = vaults.filter(x => x.id !== v.id);
  selectedVaultId = null;
  await persistVaults();
  renderVaultList();
  renderToolbarAndEditPanel();
});

/* ---- Schlüssel an offene Osiris-Seiten weitergeben (via postMessage) ----
   Wird normalerweise über das Shell-Fenster (window.parent) an die aktuell
   offene Unterseite weitergereicht — siehe portfolio-shell.html, das den
   Empfang und die Weiterleitung übernimmt und ein Toast-Feedback zeigt.
   Läuft KI_SAFE. mal isoliert (kein Shell-Parent/Opener), gibt es hier
   selbst eine kurze Rückmeldung, statt einfach nichts zu tun. */
document.getElementById('apply-keys-btn').addEventListener('click', () => {
  const v = selectedVault();
  if(!v) return;
  const payload = { type: 'osirisVaultKeys', keys: v.keys };
  const hasParent = window.parent && window.parent !== window;
  const hasOpener = !!window.opener;
  if(hasParent) window.parent.postMessage(payload, '*');
  if(hasOpener) window.opener.postMessage(payload, '*');
  const statusEl = document.getElementById('manage-status');
  statusEl.textContent = (hasParent || hasOpener)
    ? `„${v.name}" gesendet — die Shell reicht die Schlüssel an die offene Seite weiter.`
    : 'Kein Shell-Fenster gefunden — dieser Vault muss über die Osiris-Shell geöffnet werden, damit „SCHLÜSSEL ANWENDEN" wirkt.';
  statusEl.className = 'status-msg' + ((hasParent || hasOpener) ? ' ok' : '');
});

/* ---- Alle Vaults löschen (freiwillige Sicherheitslöschung) ---- */
document.getElementById('delete-all-btn').addEventListener('click', () => {
  if(!confirm('Wirklich ALLE Vaults unwiderruflich löschen?')) return;
  wipeStore();
  backToLockView();
});

/* ---- Sticker: zufällige Farbe/Neigung bei jedem Öffnen ---- */
const stickerFrame = document.getElementById('sticker-frame');
const stickerPalette = ['#d9ece6', '#f7e6c4', '#e6d9f0', '#f0d9df', '#d9e3f0', '#e3f0d9'];
let lastStickerIndex = -1;
function rerollSticker(){
  let next;
  do { next = Math.floor(Math.random() * stickerPalette.length); }
  while (next === lastStickerIndex && stickerPalette.length > 1);
  lastStickerIndex = next;
  stickerFrame.style.setProperty('--sticker-color', stickerPalette[next]);
  const angle = (Math.random() * 10 - 5).toFixed(2);
  stickerFrame.style.setProperty('--tilt', `${angle}deg`);
}
rerollSticker();

/* ---- Ziehbar: am Header greifen und frei auf dem Bildschirm bewegen ---- */
const dragHandle = document.getElementById('drag-handle');
let dragging = false;
let dragOffsetX = 0;
let dragOffsetY = 0;

dragHandle.addEventListener('pointerdown', (e) => {
  if(e.target.closest('.icon-btn')) return;
  const rect = stickerFrame.getBoundingClientRect();
  stickerFrame.style.left = rect.left + 'px';
  stickerFrame.style.top = rect.top + 'px';
  stickerFrame.style.transform = 'rotate(var(--tilt, -3deg))';
  dragOffsetX = e.clientX - rect.left;
  dragOffsetY = e.clientY - rect.top;
  dragging = true;
  dragHandle.classList.add('dragging');
  dragHandle.setPointerCapture(e.pointerId);
});
dragHandle.addEventListener('pointermove', (e) => {
  if(!dragging) return;
  const maxX = Math.max(window.innerWidth - stickerFrame.offsetWidth, 0);
  const maxY = Math.max(window.innerHeight - stickerFrame.offsetHeight, 0);
  const x = Math.min(Math.max(e.clientX - dragOffsetX, 0), maxX);
  const y = Math.min(Math.max(e.clientY - dragOffsetY, 0), maxY);
  stickerFrame.style.left = x + 'px';
  stickerFrame.style.top = y + 'px';
});
function endDrag(){ dragging = false; dragHandle.classList.remove('dragging'); }
dragHandle.addEventListener('pointerup', endDrag);
dragHandle.addEventListener('pointercancel', endDrag);

/* ---- Von portfolio-shell.html aufgerufen (via unsichtbares iframe) —
   liefert/ersetzt den rohen, weiterhin verschlüsselten Blob, ohne ihn
   hier zu entschlüsseln. Kein Passphrase-Austausch nötig: es werden
   nur dieselben Chiffretext-Bytes verschoben, die sonst in
   localStorage liegen. */
window.addEventListener('message', (e) => {
  if (!e.data || !e.data.type) return;
  if (e.data.type === 'osirisVaultRequestExport'){
    const raw = loadStoreBlob();
    if (e.source) e.source.postMessage({ type: 'osirisVaultExportData', blob: raw }, e.origin || '*');
  } else if (e.data.type === 'osirisVaultRestoreBlob' && e.data.blob){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(e.data.blob)); }catch(err){ /* Speicher nicht verfügbar */ }
  }
});

/* ---- Start ---- */
renderLockView();
</script>
